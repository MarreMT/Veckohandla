name: Uppdatera erbjudanden och publicera

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'   # varje natt, ca 04:17 svensk tid
  workflow_dispatch:        # gör att du kan starta den för hand

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Sparar senaste lyckade erbjudandefilen, så att sajten har något att visa även om en hämtning misslyckas.
      - uses: actions/cache@v4
        with:
          path: |
            docs/offers.json
            docs/nutrition.json
          key: data-${{ github.run_id }}
          restore-keys: |
            data-
            offers-

      - name: Hämta erbjudanden
        id: fetch
        continue-on-error: true
        env:
          TJEK_API_KEY: ${{ secrets.TJEK_API_KEY }}
        run: node scripts/fetch-offers.mjs

      # Näringsvärden från Livsmedelsverket. Hämtas om högst en gång i veckan.
      - name: Hämta näringsvärden
        id: nutrition
        continue-on-error: true
        run: node scripts/fetch-nutrition.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4

      # Markerar körningen som röd om hämtningen misslyckades, trots att appen publicerades.
      - name: Larma om något misslyckades
        if: steps.fetch.outcome == 'failure' || steps.nutrition.outcome == 'failure'
        run: |
          if [ "${{ steps.fetch.outcome }}" = "failure" ]; then echo "::error::Erbjudandena kunde inte hämtas. Öppna steget Hämta erbjudanden."; fi
          if [ "${{ steps.nutrition.outcome }}" = "failure" ]; then echo "::error::Näringsvärdena kunde inte hämtas. Öppna steget Hämta näringsvärden."; fi
          exit 1
