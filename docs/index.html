<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veckohandla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
:root{
  --bg:#F3F6F1; --surface:#FFFFFF; --ink:#15241D; --muted:#58695F; --line:#D5DDD6;
  --brand:#1D5B44; --brand-ink:#FFFFFF; --soft:#E3EDE6; --tag:#FFD02E; --tag-ink:#352A00;
  --danger:#B3261E; --paper:#FBFAF3; --shadow:0 1px 0 rgba(21,36,29,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1613; --surface:#17221D; --ink:#E9F0EB; --muted:#9AAAA1; --line:#2A3831;
    --brand:#62C99D; --brand-ink:#0B1A13; --soft:#1F2F27; --tag:#FFD02E; --tag-ink:#352A00;
    --danger:#FF8A80; --paper:#1D2822; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#17221D; --ink:#E9F0EB; --muted:#9AAAA1; --line:#2A3831;
  --brand:#62C99D; --brand-ink:#0B1A13; --soft:#1F2F27; --tag:#FFD02E; --tag-ink:#352A00;
  --danger:#FF8A80; --paper:#1D2822; --shadow:none; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:400 16px/1.5 'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
h1,h2,h3{font-stretch:78%;font-weight:800;line-height:1.1;margin:0;letter-spacing:.005em}
h1{font-size:1.5rem}
h2{font-size:1.5rem;margin-bottom:.6rem}
h3{font-size:1.15rem}
p{margin:.3rem 0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:4px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding:.7rem 1rem .0;display:flex;align-items:baseline;gap:.8rem}
.top-in .where{color:var(--muted);font-size:.9rem}
.tabs{max-width:1040px;margin:0 auto;display:flex;gap:.2rem;overflow-x:auto;padding:0 .6rem;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:.7rem .7rem .55rem;color:var(--muted);font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand);font-weight:800}
main{max-width:1040px;margin:0 auto;padding:1rem 1rem 4rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem;box-shadow:var(--shadow);margin-bottom:1rem}
.card>h2{margin-bottom:.4rem}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.grid{display:grid;gap:1rem}
@media(min-width:760px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.5rem .9rem;font-weight:700}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:.25rem .6rem;font-size:.88rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.spread{justify-content:space-between}
/* basket summary */
.basket{display:grid;gap:1rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:1rem}
@media(min-width:760px){.basket{grid-template-columns:auto 1fr auto}}
.total{background:var(--tag);color:var(--tag-ink);padding:.6rem 1.4rem .6rem 1rem;
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%);display:inline-flex;flex-direction:column;justify-self:start}
.total .amt{font-stretch:75%;font-weight:900;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.total .lbl{font-weight:600;font-size:.85rem}
/* tag stickers */
.tag{display:inline-block;background:var(--tag);color:var(--tag-ink);font-weight:800;font-size:.78rem;line-height:1;padding:.28rem .7rem .28rem .45rem;
  clip-path:polygon(0 0,calc(100% - 7px) 0,100% 50%,calc(100% - 7px) 100%,0 100%);margin:0 .25rem .25rem 0;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;margin-top:.4rem}
/* sliders */
.slider{display:grid;grid-template-columns:1fr auto;gap:.1rem .6rem;margin:.7rem 0}
.slider span{font-weight:700}
.slider output{font-weight:800;font-variant-numeric:tabular-nums}
.slider input{grid-column:1/-1;width:100%;accent-color:var(--brand)}
.slider small{grid-column:1/-1;color:var(--muted)}
/* meals */
.meal-group{margin:1.4rem 0 .6rem}
.meal-group h2{margin:0}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.9rem;display:flex;flex-direction:column;gap:.35rem}
.meal-head{display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start}
.days{background:var(--soft);border-radius:999px;padding:.1rem .6rem;font-weight:700;font-size:.82rem;white-space:nowrap}
.persons{list-style:none;margin:.2rem 0;padding:0;display:grid;gap:.15rem;font-size:.92rem}
.persons li{display:flex;flex-wrap:wrap;gap:.2rem .6rem;align-items:baseline}
.persons .pn{font-weight:700;min-width:5.5rem}
.persons b{font-variant-numeric:tabular-nums}
details.ing{font-size:.9rem}
details.ing summary{cursor:pointer;color:var(--brand);font-weight:700}
table.t{width:100%;border-collapse:collapse;margin-top:.3rem;font-variant-numeric:tabular-nums}
table.t th,table.t td{text-align:left;padding:.15rem .4rem .15rem 0;border-bottom:1px solid var(--line)}
table.t td.num,table.t th.num{text-align:right}
.tools{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-top:.3rem}
.tools select{flex:1;min-width:8rem;max-width:100%;padding:.3rem;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.stars{display:inline-flex}
.star{background:none;border:0;padding:0 .08rem;font-size:1.25rem;line-height:1;color:var(--line)}
.star.on{color:#E7A100}
/* store options */
.opts{display:grid;gap:.5rem}
.opt{display:grid;grid-template-columns:1fr auto;gap:.1rem .8rem;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:.6rem .8rem;width:100%}
.opt.on{border-color:var(--brand);background:var(--soft)}
.opt .nm{font-weight:800}
.opt .pr{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.opt .dl{grid-column:1/-1;color:var(--muted);font-size:.88rem}
/* receipt */
.receipts{display:grid;gap:1.4rem}
@media(min-width:760px){.receipts{grid-template-columns:1fr 1fr;align-items:start}}
.receipt{background:var(--paper);border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;padding:1rem 1rem .6rem;font-variant-numeric:tabular-nums}
.receipt::after{content:"";display:block;height:10px;margin:.6rem -1rem 0;background:
  linear-gradient(135deg,var(--bg) 25%,transparent 25%) -5px 0/10px 10px,
  linear-gradient(225deg,var(--bg) 25%,transparent 25%) -5px 0/10px 10px}
.receipt h3{display:flex;justify-content:space-between;border-bottom:2px dashed var(--line);padding-bottom:.4rem;margin-bottom:.3rem}
.line{display:grid;grid-template-columns:auto 1fr auto;gap:.1rem .6rem;align-items:start;padding:.35rem 0;border-bottom:1px dashed var(--line)}
.line.done .nm{text-decoration:line-through;color:var(--muted)}
.line .nm small{display:block;color:var(--muted)}
.line .pr{font-weight:700;text-align:right;white-space:nowrap}
.line input[type=checkbox]{width:1.25rem;height:1.25rem;margin:.15rem 0 0;accent-color:var(--brand)}
.sum{display:flex;justify-content:space-between;padding:.25rem 0}
.sum.big{font-stretch:78%;font-weight:900;font-size:1.5rem;border-top:2px dashed var(--line);margin-top:.3rem;padding-top:.5rem}
.catlbl{font-weight:700;color:var(--muted);font-size:.85rem;padding-top:.5rem}
textarea.note{width:100%;min-height:15rem;font:500 .9rem/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:.7rem;resize:vertical}
/* forms */
.field{display:grid;gap:.2rem;margin-bottom:.6rem}
.field label,.field .lab{font-weight:700;font-size:.9rem}
input[type=text],input[type=number],select,textarea.in{width:100%;padding:.45rem .55rem;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.fields{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr))}
.check{display:flex;gap:.5rem;align-items:flex-start;margin:.4rem 0}
.check input{width:1.2rem;height:1.2rem;margin-top:.15rem;accent-color:var(--brand)}
.pantry{display:grid;gap:.4rem;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr))}
.pitem{display:flex;gap:.5rem;align-items:center;border:1px solid var(--line);border-radius:8px;padding:.45rem .6rem;background:var(--surface)}
.pitem input{width:1.2rem;height:1.2rem;accent-color:var(--brand)}
.pitem.on{background:var(--soft);border-color:var(--brand)}
.pitem[hidden]{display:none}
.stat{display:flex;flex-wrap:wrap;gap:.3rem 1.2rem;font-variant-numeric:tabular-nums}
.stat b{font-weight:800}
.empty{border:2px dashed var(--line);border-radius:10px;padding:1.4rem;text-align:center;color:var(--muted)}
.ingrow{display:grid;gap:.4rem;grid-template-columns:2fr 1fr 1.4fr auto;margin-bottom:.4rem}
@media(max-width:560px){.ingrow{grid-template-columns:1fr 1fr}}
#toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.55rem 1rem;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
hr.sep{border:0;border-top:1px solid var(--line);margin:.8rem 0}
</style>
</head>
<body>
<header class="top">
  <div class="top-in"><h1>Veckohandla</h1><span class="where" id="where"></span><span class="where" id="build" style="margin-left:auto"></span></div>

</header>
<main id="view"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
const BUILD='2026-10-28d';

/* ================= hjälpfunktioner ================= */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf0=new Intl.NumberFormat('sv-SE',{maximumFractionDigits:0});
const nf1=new Intl.NumberFormat('sv-SE',{maximumFractionDigits:1});
const n0=x=>nf0.format(Math.round(x));
const n1=x=>nf1.format(x);

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}return Math.abs(h)}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)}
function untilText(){const d=new Date();d.setDate(d.getDate()+((7-d.getDay())%7));return d.toLocaleDateString('sv-SE',{weekday:'short',day:'numeric',month:'short'})}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}

/* ================= grunddata ================= */

/* id, namn, kategori, lagring, förpackning (g), kcal, protein, kolhydrat, fett (per 100 g), basPris (kr) */

['kyckling','Kycklingfilé','Kött & fisk','fresh',900,110,23,0,2,119],

['kvarg','Laktosfri kvarg','Kylvaror','fresh',500,65,11,3,0.2,29],
['feta','Fetaost','Kylvaror','fresh',200,260,14,1,21,29],
['mjolk','Laktosfri mjölk, 1 l','Kylvaror','fresh',1000,45,3.5,4.8,1.5,17],
['gradde','Laktosfri matlagningsgrädde','Kylvaror','fresh',200,195,2.5,4,19,19],
['potatis','Potatis','Frukt & grönt','fresh',2000,77,2,17,0.1,29],
['sotpotatis','Sötpotatis','Frukt & grönt','fresh',1000,86,1.6,20,0.1,29],
['paprika','Paprika','Frukt & grönt','fresh',500,30,1,6,0.3,29],
['lok','Gul lök','Frukt & grönt','fresh',1000,40,1,9,0.1,19],

['tortilla','Tortillabröd, 8 st','Bröd & bakverk','fresh',320,300,8,50,7,25],
['broccoli','Broccoli, fryst','Fryst','frozen',600,35,3,3,0.5,25],

['mjol','Vetemjöl','Torrvaror & burkar','pantry',2000,350,10,72,1.5,25],
['socker','Strösocker','Torrvaror & burkar','pantry',1000,400,0,100,0,20]
];
const PRODUCTS={};
P_RAW.forEach(r=>PRODUCTS[r[0]]={id:r[0],name:r[1],cat:r[2],stor:r[3],pack:r[4],k:r[5],p:r[6],c:r[7],f:r[8],base:r[9]});
/* Hur mängden visas: antal (med gram per styck), volym i dl, annars vikt */
/* Hur mängden visas: antal (gram per styck, ental, flertal), volym, annars vikt */
const COUNT={agg:[55,'ägg','ägg'],tortilla:[40,'bröd','bröd'],banan:[120,'banan','bananer'],paprika:[160,'paprika','paprikor'],
 lok:[110,'lök','lökar'],gurka:[350,'gurka','gurkor'],vitlok:[4,'klyfta','klyftor'],morot:[80,'morot','morötter'],
 potatis:[90,'potatis','potatisar'],sotpotatis:[250,'sötpotatis','sötpotatisar'],tomat:[100,'tomat','tomater']};
const VOL=new Set(['mjolk','gradde','vispgradde','olja','soja','kokos']);
function volText(g){
  if(g>=1000)return n1(Math.round(g/100)/10)+' l';
  if(g>=100)return n1(Math.round(g/10)/10)+' dl';
  return n0(Math.round(g/5)*5)+' ml';
}
function wtText(g){return g>=1000?n1(Math.round(g/100)/10)+' kg':n0(Math.round(g/10)*10)+' g'}
function amountText(pid,g){
  const c=COUNT[pid];
  if(c){const n=Math.max(1,Math.round(g/c[0]));return n+' '+(n===1?c[1]:c[2])}
  return VOL.has(pid)?volText(g):wtText(g);
}
function packText(pid,g){
  const c=COUNT[pid];
  if(c){const n=Math.max(1,Math.round(g/c[0]));return n+' '+(n===1?c[1]:c[2])}
  return VOL.has(pid)?volText(g):(g>=1000?n1(Math.round(g/100)/10)+' kg':n0(g)+' g');
}
function packText(pid,g){
  const c=COUNT[pid];
  if(c)return n0(Math.max(1,Math.round(g/c[0])))+' '+c[1];
  if(VOL.has(pid))return g>=1000?n1(g/1000)+' l':n0(g)+' ml';
  return g>=1000?n1(Math.round(g/100)/10)+' kg':n0(g)+' g';
}

const PRICE={};
function priceOf(pid,sid){
  const key=pid+'|'+sid;if(PRICE[key]!==undefined)return PRICE[key];
  const st=STORES.find(s=>s.id===sid),p=PRODUCTS[pid];let v=null;
  if(st&&p&&!(sid==='lidl'&&LIDL_MISSING.has(pid))){
    const j=((hash(key)%9)-4)/100;
    v=Math.max(5,Math.round(p.base*st.f*(1+j)));
  }
  PRICE[key]=v;return v;
}

const SPICE=/salt|peppar|vatten|krydd|oregano|timjan|basilika|persilja|dill|koriander|kanel|kardemumma|ingefära|chili|spiskummin|lagerblad|rosmarin|salvia|muskot|paprikapulver|buljong|fond|vinäger|senap|ketchup|socker/;
function toGrams(amount,unit,m){
  const u=String(unit||'').toLowerCase().replace(/\./g,'').trim();
  const d=m?m.dens:100;
  const U={g:1,kg:1000,hg:100,dl:d,cl:d/10,ml:d/100,l:d*10,msk:d*.15,tsk:d*.05,krm:d*.01};
  if(U[u]!==undefined)return amount*U[u];
  if(m&&/^(burk|burkar|förp|förpackning|paket|pkt)$/.test(u))return amount*PRODUCTS[m.pid].pack;
  if(m&&m.piece&&(u===''||/^(st|stycken|klyfta|klyftor|skiva|skivor|port|portion|portioner|filé|filéer)$/.test(u)))return amount*m.piece;
  return null;
}
/* Gör om ett recept från ReceptAPI till appens format. Sparar bara fakta (ingredienser, mängder, tid) och en länk till källan. */
function mapApiRecipe(d,meal){
  const sv=Math.max(1,+d.servings||4);
  const agg={},extra=[];let mapG=0,xG=0,nMap=0;
  (d.ingredients||[]).forEach(x=>{
    const name=(x.ingredient&&x.ingredient.name_sv)||x.raw_text||'';
    const nm=name.toLowerCase();
    const m=IMAP.find(e=>e.re.test(nm)&&!(e.not&&e.not.test(nm)));
    if(m){
      let g=x.amount!=null?toGrams(x.amount,x.unit,m):null;
      if(g==null&&x.amount==null&&m.pid==='olja')g=sv*5;
      if(g!=null&&g>0){agg[m.pid]=(agg[m.pid]||0)+g;mapG+=g;nMap++;return}
    }
    if(SPICE.test(nm))return;
    const g=x.amount!=null?toGrams(x.amount,x.unit,null):null;
    if(g!=null)xG+=g;
    extra.push({name,g:g!=null?Math.round(g/sv*10)/10:null,text:x.raw_text||name});
  });
  const ing=Object.keys(agg).map(pid=>[pid,Math.round(agg[pid]/sv*10)/10,roleOf(pid)]).filter(i=>i[1]>=3);
  const total=nMap+extra.length;
  const info={mapped:nMap,total,unmapped:extra.map(e=>e.name)};
  if(nMap<2||nMap/Math.max(1,total)<.5||mapG/Math.max(1,mapG+xG)<.65)
    return {ok:false,info,reason:`Bara ${nMap} av ${total} ingredienser kunde kopplas till varor i appen, så näringsvärdena skulle bli för osäkra.`};
  let k=0,pg=0;ing.forEach(([pid,g,role])=>{k+=PRODUCTS[pid].k*g/100;if(role==='P')pg+=g});
  const lo=meal==='frukost'||meal==='mellanmal'?90:230,hi=meal==='frukost'||meal==='mellanmal'?900:1300;
  if(k<lo||k>hi)return {ok:false,info,reason:`Portionen blir ${n0(k)} kcal av de ingredienser som kunde kopplas, vilket ser fel ut för ${MNAME[meal].toLowerCase()}.`};
  if(pg<40&&meal!=='frukost'&&meal!=='mellanmal')return {ok:false,info,reason:'Receptet saknar en tydlig proteinkälla bland ingredienserna som kunde kopplas.'};
  const meals=meal==='middag'?['middag','lunch']:meal==='lunch'?['lunch','middag']:[meal];
  const url=d.source&&/^https?:\/\//.test(d.source.url||'')?d.source.url:(/^https?:\/\//.test(d.url||'')?d.url:'');
  return {ok:true,info,recipe:{id:'a-'+d.slug,name:String(d.title||d.slug),meals,min:+d.total_minutes||30,lf:(d.allergens||[]).indexOf('mjolk')<0?1:0,link:url,src:(d.source&&d.source.name)||'',api:1,custom:true,ing,extra}};
}
function guessMeal(it){
  const t=((it.category||'')+' '+(it.tags||[]).join(' ')+' '+(it.title||'')).toLowerCase();
  return /frukost|gröt|smoothie/.test(t)?'frukost':'middag';
}

  TPL.forEach(t=>{

const z=()=>({k:0,p:0,c:0,f:0});
function stats(r){
  if(STATS[r.id])return STATS[r.id];
  const g={P:z(),C:z(),R:z()};let tot=z(),vegG=0,mainP=null,mainG=0,mainC=null,mainCG=0;const pids=[];
  r.ing.forEach(([pid,gr,role])=>{

    const m=gr/100,x={k:pr.k*m,p:pr.p*m,c:pr.c*m,f:pr.f*m};
    const grp=role==='P'?'P':role==='C'?'C':'R';
    ['k','p','c','f'].forEach(q=>{g[grp][q]+=x[q];tot[q]+=x[q]});
    if(role==='V')vegG+=gr;
    if(role==='P'&&gr>mainG){mainG=gr;mainP=pid}
    if(role==='C'&&gr>mainCG){mainCG=gr;mainC=pid}
    pids.push(pid);
  });
  return STATS[r.id]={g,k:tot.k,p:tot.p,c:tot.c,f:tot.f,vegG,mainP,mainC,pids};
}
function targets(pp){
  const bmr=10*pp.weight+6.25*pp.height-5*pp.age+(pp.sex==='m'?5:-161);
  const tdee=bmr*pp.act;
  const gf={lose:.85,maintain:1,gain:1.10}[pp.goal]||1;
  const kcal=tdee*gf;
  const prot=Math.min(state.protein*pp.weight,kcal*.4/4);
  return {bmr,tdee,kcal,prot};
}
function shareOf(meal){
  let tot=0;MEALS.forEach(m=>{if(state.meals[m.k].on)tot+=m.share});
  const m=MEALS.find(x=>x.k===meal);return tot>0?m.share/tot:0;
}
/* Skalar protein-, kolhydrat- och övriga delar var för sig så att både kalori- och proteinmål träffas */
function adapt(r,K,Pt){
  const st=stats(r),G=st.g;
  const kR=G.R.k,pR=G.R.p;let a=1,b=1;
  const D=G.P.k*G.C.p-G.C.k*G.P.p;
  if(G.P.k>0&&G.C.k>0&&Math.abs(D)>1e-6){
    a=((K-kR)*G.C.p-G.C.k*(Pt-pR))/D;
    b=(G.P.k*(Pt-pR)-G.P.p*(K-kR))/D;
    a=clamp(a,.6,1.8);b=clamp(b,.5,1.8);
  }
  const k1=a*G.P.k+b*G.C.k+kR;
  const s=clamp(K/Math.max(k1,1),.4,2.6);
  const fa=a*s,fb=b*s,fr=s;
  const out={fa,fb,fr};
  ['k','p','c','f'].forEach(q=>{out[q]=(a*G.P[q]+b*G.C[q]+G.R[q])*s});
  return out;
}
function portionsFor(meal,r){
  const sh=shareOf(meal);
  return state.persons.map(pp=>{const t=targets(pp);const a=adapt(r,t.kcal*sh,t.prot*sh);a.pp=pp;return a});
}
function dist(meal,n){
  const days=state.meals[meal].days;if(n<1)return [];
  const base=Math.floor(days/n),rem=days%n;const out=[];
  for(let i=0;i<n;i++)out.push(base+(i<rem?1:0));return out;
}

function regPerPack(o){

function packCost(pid,sid,grams,off){
  const p=PRODUCTS[pid],o=off[sid+'|'+pid],est=priceOf(pid,sid);
  if(est==null&&!o)return null;
  const base=(o&&o.packG>0)?o.packG:p.pack;
  const n=Math.max(1,Math.ceil(grams/base-0.1));
  const reg=o?regPerPack(o):est;
  let bought=n,cost=n*reg,used=null;
  if(o){
    const ue=offerEff(o);
    const stockOK=state.stock&&p.stor!=='fresh'&&ue<=0.8*reg;
    if(o.kind==='price'){
      const mx=o.max>0?o.max:999;
      const q=Math.min(mx,stockOK?n+3:n);
      bought=Math.max(n,q);const at=Math.min(bought,q);
      cost=at*o.price+(bought-at)*reg;used=o;
    }else{
      const mxg=o.max>0?Math.floor(o.max/o.buy):999;
      let g=stockOK?Math.ceil(n/o.buy):Math.floor(n/o.buy);g=Math.min(g,mxg);
      if(g>0){const rest=Math.max(0,n-g*o.buy);bought=g*o.buy+rest;cost=g*o.pay*o.price+rest*reg;used=o}
    }
  }
  const extra=Math.max(0,bought-n);
  return {sid,pid,n,bought,extra,cost,needCost:cost*(n/bought),reg,packG:base,used,savings:Math.max(0,bought*reg-cost)};

function evalSet(ids,needs,off){
  const lines=[],missing=[];let cost=0,need=0,save=0,hits=0;
  for(const pid in needs){
    const gr=needs[pid].grams;let best=null;
    ids.forEach(sid=>{
      const r=packCost(pid,sid,gr,off);if(!r)return;
      const better=!best||(r.used?1:0)>(best.used?1:0)||((r.used?1:0)===(best.used?1:0)&&r.needCost<best.needCost-1e-9);
      if(better)best=r;
    });
    if(best){best.grams=gr;lines.push(best);cost+=best.cost;need+=best.needCost;save+=best.savings;if(best.used)hits++}
    else{
      let alt=null;allowedIds().forEach(sid=>{const r=packCost(pid,sid,gr,off);if(r&&(!alt||r.needCost<alt.needCost))alt=r});
      missing.push({pid,n:alt?alt.n:needs[pid].packs,alt});if(alt){cost+=alt.cost;need+=alt.needCost}
    }

  return {ids,lines,missing,cost,need,save,hits};
}
let EXTRAS={};
function computeNeeds(){
  const grams={};EXTRAS={};
  MEALS.forEach(m=>{
    if(!state.meals[m.k].on)return;
    const es=(state.plan&&state.plan[m.k])||[];const days=dist(m.k,es.length);
    es.forEach((e,i)=>{
      const r=RBY[e.rid];if(!r)return;
      portionsFor(m.k,r).forEach(a=>{
        (r.extra||[]).forEach(x=>{
          const e=EXTRAS[x.name]||(EXTRAS[x.name]={g:0,text:x.text,known:false});
          if(x.g!=null){e.g+=x.g*a.fr*days[i];e.known=true}
        });
        r.ing.forEach(([pid,g,role])=>{
          const f=role==='P'?a.fa:role==='C'?a.fb:a.fr;
          grams[pid]=(grams[pid]||0)+g*f*days[i];
        });
      });
    });
  });
  const needs={};
  for(const pid in grams){
    if(state.pantry[pid]||!PRODUCTS[pid])continue;
    needs[pid]={grams:grams[pid],packs:Math.max(1,Math.ceil(grams[pid]/PRODUCTS[pid].pack-0.1))};
  }
  return needs;
}
function calc(){
  const off=offerIndex(),allowed=allowedIds(),needs=computeNeeds();
  const sets=[];
  allowed.forEach(a=>sets.push([a]));

  const pen=1+state.w.stores/35;              // hur många extra fynd ett andra besök måste ge
  const options=sets.map(ids=>{
    const ev=evalSet(ids,needs,off);
    ev.score=ev.hits-pen*(ids.length-1)-1.5*ev.missing.length;
    ev.key=ids.join('+');
    return ev;
  });
  options.sort((a,b)=>b.score-a.score||b.save-a.save||a.ids.length-b.ids.length);
  const auto=options[0];
  let active=auto;
  if(state.chosen){const k=state.chosen.join('+');const f=options.find(o=>o.key===k);if(f)active=f}
  const singles=options.filter(o=>o.ids.length===1).sort((a,b)=>(b.hits-1.5*b.missing.length)-(a.hits-1.5*a.missing.length)||b.save-a.save);
  const pairs=options.filter(o=>o.ids.length===2).sort((a,b)=>(b.hits-1.5*b.missing.length)-(a.hits-1.5*a.missing.length)||b.save-a.save);
  const days={};
  MEALS.forEach(m=>{days[m.k]=dist(m.k,((state.plan&&state.plan[m.k])||[]).length)});
  const picks=pickedOffers().filter(o=>{
    if(!state.stores[o.store])return false;
    return !o.pid||!needs[o.pid]||active.lines.every(l=>!(l.pid===o.pid&&l.used&&l.used.id===o.id));
  });
  return {off,allowed,needs,extras:EXTRAS,picks,options,auto,active,singles,pairs,days,
          bestSingle:singles[0]||null,bestPair:pairs[0]||null};
}

/* ================= receptval ================= */
function costInfo(r,set,off){
  let eff=0,reg=0;
  r.ing.forEach(([pid,g])=>{
    const pk=PRODUCTS[pid].pack;
    const ok=s=>priceOf(pid,s)!=null||off[s+'|'+pid];
    let sids=set.filter(ok);
    if(!sids.length)sids=allowedIds().filter(ok);
    let rg=Infinity,ef=Infinity;
    sids.forEach(s=>{
      const o=off[s+'|'+pid],og=(o&&o.packG>0)?o.packG:pk;
      const rpg=o?regPerPack(o)/og:priceOf(pid,s)/pk;
      let u=rpg;if(o)u=Math.min(u,offerEff(o)/og);
      rg=Math.min(rg,rpg);ef=Math.min(ef,u);
    });
    if(!isFinite(rg)){rg=ef=PRODUCTS[pid].base/pk}
    eff+=g*ef;reg+=g*rg;
  });
  return {eff,reg,save:reg-eff};
}
function lastEaten(){
  const m={};
  (state.log||[]).forEach(l=>{const t=new Date(l.date).getTime();l.items.forEach(i=>{if(!m[i.rid]||m[i.rid]<t)m[i.rid]=t})});
  return m;
}
function targetProtShare(){
  let s=0;state.persons.forEach(pp=>{const t=targets(pp);s+=t.prot*4/t.kcal});
  return Math.max(.12,s/Math.max(1,state.persons.length));
}
function scoreCands(meal,ctx){
  const cands=RECIPES.filter(r=>r.meals.includes(meal));
  const infos=cands.map(r=>({r,ci:costInfo(r,ctx.set,ctx.off)}));
  const cs=infos.map(x=>x.ci.eff),mn=Math.min.apply(null,cs),mx=Math.max.apply(null,cs);
  const tps=targetProtShare(),wh=state.w.health/100,wp=state.w.price/100;
  const last=lastEaten(),now=Date.now();
  return infos.map(({r,ci})=>{
    const st=stats(r);
    const ps=Math.min(1,(st.p*4/Math.max(st.k,1))/tps);
    const veg=Math.min(1,st.vegG/150);
    const health=.65*ps+.35*veg;
    const cheap=mx>mn?1-(ci.eff-mn)/(mx-mn):.5;
    const sav=Math.min(1,(ci.save/Math.max(1,ci.reg))/.3);
    const price=.5*cheap+.5*sav;
    let s=1.2*wh*health+1.2*wp*price;
    const pk=ctx.picked||{};
    const nPicked=st.pids.filter(p=>pk[p]).length;
    if(nPicked)s+=1.4*Math.min(2,nPicked);
    const rt=state.ratings[r.id];
    if(rt)s+=(rt-3)*.3-(rt<=2?.8:0);
    if(last[r.id]!=null){const d=(now-last[r.id])/864e5;if(d<8)s-=(rt>=4?.15:.5);else if(d<15)s-=(rt>=4?0:.2)}
    if(state.lf&&!r.lf)s-=.5;
    s-=.25*ctx.proteins.filter(x=>x===st.mainP).length;
    if(meal==='middag'||meal==='lunch'){
      s-=.5*ctx.carbs.filter(x=>x===st.mainC).length;
      if(r.gen)s-=.4*ctx.tpls.filter(x=>x===r.id.split('-')[1]).length;
    }
    const shared=st.pids.filter(p=>ctx.pids.has(p)&&!state.pantry[p]).length;
    s+=Math.min(.3,.05*shared);
    s+=ctx.noise*(((hash(r.id+':'+state.seed)%1000)/500)-1);
    return {r,s,ci};
  }).sort((a,b)=>b.s-a.s);
}
function note(ctx,rid){const r=RBY[rid];if(!r)return;const st=stats(r);ctx.proteins.push(st.mainP);ctx.carbs.push(st.mainC);if(r.gen)ctx.tpls.push(r.id.split('-')[1]);st.pids.forEach(p=>ctx.pids.add(p))}
function newCtx(set,noise){return {set,off:offerIndex(),noise:noise||0,picked:pickedPids(),proteins:[],carbs:[],tpls:[],pids:new Set()}}
function buildPlan(set,noise,keepAll,prev){
  const ctx=newCtx(set,noise),plan={};prev=prev||{};
  ORDER.forEach(mk=>{
    const cfg=state.meals[mk];if(!cfg.on)return;
    const cands=RECIPES.filter(r=>r.meals.includes(mk));
    const uniq=Math.max(1,Math.min(cfg.uniq,cfg.days,cands.length));
    let entries=(prev[mk]||[]).filter(e=>RBY[e.rid]&&RBY[e.rid].meals.includes(mk)&&(e.locked||keepAll)).map(e=>({rid:e.rid,locked:!!e.locked}));
    while(entries.length>uniq){
      let i=-1;for(let j=entries.length-1;j>=0;j--)if(!entries[j].locked){i=j;break}
      if(i<0)i=entries.length-1;entries.splice(i,1);
    }
    entries.forEach(e=>note(ctx,e.rid));
    while(entries.length<uniq){
      const sc=scoreCands(mk,ctx).filter(x=>!entries.some(e=>e.rid===x.r.id));
      if(!sc.length)break;
      entries.push({rid:sc[0].r.id,locked:false});note(ctx,sc[0].r.id);
    }
    plan[mk]=entries;
  });
  return plan;
}
function regenerate(noise,keepAll){
  const prev=state.plan;let set=allowedIds();
  for(let pass=0;pass<2;pass++){
    state.plan=buildPlan(set,noise,keepAll,prev);
    const c=calc();set=c.active.ids;
  }
  if(state.chosen&&!state.chosen.every(id=>state.stores[id]))state.chosen=null;
  save();
}

function insight(c){
  const a=c.active,bs=c.bestSingle;

    const d=a.hits-bs.hits;
    return d>0?`Det andra besöket ger ${d} fler fynd än att handla allt hos ${SNAME[bs.ids[0]]}.`

function groupByStore(c){
  const m={};
  c.active.lines.forEach(l=>{

    (m[key]=m[key]||{sid:key,lines:[],hits:0});
    m[key].lines.push(l);if(l.used)m[key].hits++;

  const arr=Object.keys(m).map(k=>m[k]);
  arr.forEach(g=>g.lines.sort((x,y)=>CATS.indexOf(PRODUCTS[x.pid].cat)-CATS.indexOf(PRODUCTS[y.pid].cat)||PRODUCTS[x.pid].name.localeCompare(PRODUCTS[y.pid].name,'sv')));

}

const FIND={q:'',cat:'',items:[],total:0,offset:0,msg:'',remaining:null};
const HUNT={items:[],msg:''};
const QWORD={kyckling:'kyckling',notfars:'nötfärs',blandfars:'blandfärs',kalkonfars:'kalkonfärs',flaskfile:'fläskfilé',lax:'lax',torsk:'torsk',rakor:'räkor',tofu:'tofu',kikartor:'kikärtor',bonor:'svarta bönor',linser:'linser',agg:'ägg'};
function topOfferProteins(){
  const off=offerIndex(),best={};
  Object.keys(off).forEach(k=>{
    const o=off[k];if(!ROLE_P.has(o.pid)||!QWORD[o.pid]||!state.stores[o.store])return;
    if(!(o.reg>0||(!state.offers&&!LIVE)))return;
    const frac=1-offerEff(o)/regPerPack(o);
    if(!best[o.pid]||frac>best[o.pid].frac)best[o.pid]={pid:o.pid,frac,store:o.store};
  });
  return Object.values(best).sort((a,b)=>b.frac-a.frac).slice(0,3);
}
function renderHunt(){
  const box=$('#huntres');if(!box)return;
  let h=HUNT.msg?`<p class="muted small">${esc(HUNT.msg)}</p>`:'';
  HUNT.items.forEach((it,i)=>{
    h+=`<div class="line" style="grid-template-columns:1fr auto"><div class="nm"><b>${esc(it.recipe.name)}</b>
      <small>Ca ${n0(it.cost)} kr per portion, ${n0(it.save*100)} % av ingredienskostnaden är kampanj. Hittad via kampanjen på ${esc((PNOUN[it.pid]||'').toLowerCase())} hos ${esc(SNAME[it.store]||'')}. Källa: ${esc(it.recipe.src||'okänd')}. ${it.info.mapped} av ${it.info.total} ingredienser kopplade.</small></div>
      <button class="btn sm primary" data-act="addhunt" data-i="${i}">Lägg till</button></div>`;
  });
  if(HUNT.items.length)h+=`<p class="small muted"><a href="https://receptapi.se" target="_blank" rel="noopener noreferrer">Data från ReceptAPI – receptapi.se</a></p>`;
  box.innerHTML=h;
}
async function huntRecipes(){
  const tops=topOfferProteins();
  if(!tops.length){HUNT.msg='Hittade inga proteinvaror på kampanj just nu.';renderHunt();return}
  HUNT.items=[];HUNT.msg='Letar recept, det kan ta en liten stund...';renderHunt();
  const off=offerIndex();
  try{
    for(const t of tops){
      const j=await apiGet('/recipes?'+new URLSearchParams({q:QWORD[t.pid],category:'huvudratt',limit:'10'}).toString());
      const cands=(j.data||[]).filter(it=>!state.custom.some(c=>c.id==='a-'+it.slug)&&!HUNT.items.some(h=>h.recipe.id==='a-'+it.slug)).slice(0,3);
      for(const it of cands){
        const d=await apiGet('/recipes/'+encodeURIComponent(it.slug));
        const r=mapApiRecipe(d.data,'middag');
        if(!r.ok)continue;
        const ci=costInfo(r.recipe,allowedIds(),off);
        HUNT.items.push({recipe:r.recipe,info:r.info,save:ci.reg>0?ci.save/ci.reg:0,cost:ci.eff,pid:t.pid,store:t.store});
      }
    }
    HUNT.items.sort((a,b)=>b.save-a.save);
    HUNT.msg=(HUNT.items.length?`Hittade ${HUNT.items.length} recept, sorterade på hur mycket av ingredienserna som är på kampanj.`:'Inget av recepten gick att koppla till appens varor. Sök själv eller försök igen i morgon.')+(FIND.remaining!=null?` Anrop kvar idag: ${FIND.remaining}.`:'');
  }catch(e){HUNT.msg=e.message}
  renderHunt();
}

async function apiGet(path){
  const headers={Accept:'application/json'};if(state.rkey)headers['x-api-key']=state.rkey;
  let res;
  try{res=await fetch('https://receptapi.se/api/v1'+path,{headers})}
  catch(e){throw new Error('Det gick inte att nå ReceptAPI. Funktionen fungerar bara när appen ligger på en vanlig webbadress, till exempel GitHub Pages.')}
  const rem=res.headers.get('x-ratelimit-remaining');if(rem!==null)FIND.remaining=+rem;
  if(!res.ok){
    let err='';try{err=(await res.json()).error||''}catch(e){}
    if(res.status===429)throw new Error('Dagsgränsen för ReceptAPI är nådd. Försök igen i morgon, eller lägg in en gratisnyckel under Inställningar.');
    if(res.status===403)throw new Error('ReceptAPI släpper bara in anrop utan nyckel från Norden. Lägg in en gratisnyckel under Inställningar.');
    if(res.status===401)throw new Error('ReceptAPI avvisade nyckeln. Kontrollera den under Inställningar.');
    throw new Error(err||('ReceptAPI svarade '+res.status));
  }
  return res.json();
}
function renderFind(){
  const box=$('#findres');if(!box)return;
  let h=FIND.msg?`<p class="muted small">${esc(FIND.msg)}</p>`:'';
  FIND.items.forEach(it=>{
    const g=guessMeal(it);
    h+=`<div class="line" style="grid-template-columns:1fr auto"><div class="nm"><b>${esc(it.title)}</b><small>${it.total_minutes||'?'} min, ${it.servings||'?'} portioner${it.category?', '+esc(it.category):''}</small></div>
      <div class="row"><select class="msel" aria-label="Måltid">${MEALS.map(m=>`<option value="${m.k}"${sel(m.k,g)}>${m.name}</option>`).join('')}</select><button class="btn sm primary" data-act="addapi" data-slug="${esc(it.slug)}">Lägg till</button></div></div>`;
  });
  if(FIND.items.length&&FIND.items.length<FIND.total)h+=`<div class="row" style="margin-top:.5rem"><button class="btn sm" data-act="findmore">Visa fler</button></div>`;
  box.innerHTML=h;
}
async function doFind(more){
  const q=($('#fq')||{}).value||'',cat=($('#fc')||{}).value||'';
  if(!more){FIND.items=[];FIND.offset=0}
  FIND.q=q;FIND.cat=cat;
  if(!q.trim()&&!cat){FIND.msg='Skriv ett sökord, till exempel kyckling eller linser.';renderFind();return}
  FIND.msg='Söker...';renderFind();
  try{
    const p=new URLSearchParams({limit:'12',offset:String(FIND.offset)});
    if(q.trim())p.set('q',q.trim());if(cat)p.set('category',cat);
    const j=await apiGet('/recipes?'+p.toString());
    FIND.items=FIND.items.concat(j.data||[]);FIND.offset=FIND.items.length;
    FIND.total=(j.meta&&j.meta.total)||FIND.items.length;
    FIND.msg=FIND.items.length?`${FIND.total} träffar.`+(FIND.remaining!=null?` Anrop kvar idag: ${FIND.remaining}.`:''):'Inga träffar. Prova ett annat sökord.';
  }catch(e){FIND.msg=e.message}
  renderFind();
}
async function addApi(slug,meal){
  FIND.msg='Hämtar receptet...';renderFind();
  try{
    const j=await apiGet('/recipes/'+encodeURIComponent(slug));
    const r=mapApiRecipe(j.data,meal);
    if(!r.ok){FIND.msg=r.reason+(r.info.unmapped.length?' Ej kopplade: '+r.info.unmapped.slice(0,6).join(', ')+'.':'');renderFind();return}
    if(state.custom.some(c=>c.id===r.recipe.id)){FIND.msg='Receptet finns redan bland dina recept.';renderFind();return}
    state.custom.push(r.recipe);save();rebuildRecipes();
    const msg=`Lade till ${r.recipe.name}. ${r.info.mapped} av ${r.info.total} ingredienser kopplades${r.recipe.extra.length?`, ${r.recipe.extra.length} läggs på listan utan pris`:''}.`+(FIND.remaining!=null?` Anrop kvar idag: ${FIND.remaining}.`:'');
    render();FIND.msg=msg;renderFind();toast('Receptet är tillagt');
  }catch(e){FIND.msg=e.message;renderFind()}
}
function addIngRow(){
  const t=$('#ingtpl'),box=$('#ingrows');if(!t||!box)return;
  box.appendChild(t.content.cloneNode(true));
}
function changed(noise,keep){try{regenerate(noise,keep);render()}catch(e){fail(e,'planen skulle göras om')}}

/* ================= händelser ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.matches('input,select,textarea'))return;
  const act=t.dataset.act;
  if(act==='tab'){tab=t.dataset.tab;render();window.scrollTo(0,0)}
  else if(act==='regen'){state.seed++;regenerate(.3,false);render();toast('Ny plan skapad')}
  else if(act==='swap'){
    const m=t.dataset.m,i=+t.dataset.i;state.seed++;
    const c=calc(),ctx=newCtx(c.active.ids,.15);
    MEALS.forEach(mm=>(state.plan[mm.k]||[]).forEach((en,ix)=>{if(!(mm.k===m&&ix===i))note(ctx,en.rid)}));
    const sc=scoreCands(m,ctx).filter(x=>!state.plan[m].some(en=>en.rid===x.r.id));
    if(!sc.length){toast('Det finns inga fler recept att byta till');return}
    state.plan[m][i]={rid:sc[Math.floor(hash('s'+state.seed)%Math.min(3,sc.length))].r.id,locked:false};
    save();render();
  }
  else if(act==='lock'){const en=state.plan[t.dataset.m][+t.dataset.i];en.locked=!en.locked;save();render()}
  else if(act==='rate'){
    const rid=t.dataset.rid,v=+t.dataset.v;
    if(state.ratings[rid]===v)delete state.ratings[rid];else state.ratings[rid]=v;
    save();render();
  }
  else if(act==='savewk'){
    const items=[];MEALS.forEach(m=>(state.plan[m.k]||[]).forEach(en=>items.push({meal:m.k,rid:en.rid})));
    state.log.unshift({date:new Date().toISOString().slice(0,10),items});save();toast('Veckan sparad i historiken');
  }
  else if(act==='delwk'){state.log.splice(+t.dataset.i,1);save();render()}
  else if(act==='pickset'){state.chosen=t.dataset.set.split('+');save();render()}
  else if(act==='autoset'){state.chosen=null;save();render()}
  else if(act==='copy'){
    const ta=$('#note');ta.focus();ta.select();let ok=false;
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(()=>toast('Anteckningen är kopierad'),()=>{document.execCommand('copy');toast('Anteckningen är kopierad')});ok=true}}catch(err){}
    if(!ok){try{ok=document.execCommand('copy')}catch(err){}toast(ok?'Anteckningen är kopierad':'Markera texten och kopiera själv')}
  }
  else if(act==='unticks'){state.ticked={};save();render()}
  else if(act==='pantryclear'){state.pantry={};save();render()}
  else if(act==='clearpicks'){state.picked={};save();rebuildRecipes();changed(0,true)}
  else if(act==='addperson'){state.persons.push({name:'Person '+(state.persons.length+1),sex:'f',age:30,height:170,weight:70,act:1.375,goal:'maintain'});save();changed(0,true)}
  else if(act==='delperson'){state.persons.splice(+t.dataset.i,1);save();changed(0,true)}
  else if(act==='resetall'){
    if(confirm('Vill du rensa all data? Betyg, historik och skafferi försvinner.')){
      try{localStorage.removeItem(KEY)}catch(err){}
      state=loadState();state.pantry={};rebuildRecipes();regenerate(0,false);tab='plan';render();
    }
  }
  else if(act==='hunt')huntRecipes();
  else if(act==='addhunt'){const i=+t.dataset.i,it=HUNT.items[i];if(it){state.custom.push(it.recipe);HUNT.items.splice(i,1);save();rebuildRecipes();render();toast('Receptet är tillagt')}}
  else if(act==='find')doFind(false);
  else if(act==='findmore')doFind(true);
  else if(act==='addapi'){const row=t.closest('.line');addApi(t.dataset.slug,row.querySelector('.msel').value)}
  else if(act==='addingrow')addIngRow();
  else if(act==='delingrow'){const row=t.closest('.ingrow');if(row)row.remove()}
  else if(act==='saverecipe'){
    const name=$('#rn').value.trim();
    const ing=$$('#ingrows .ingrow').map(r=>[$('.ip',r).value,+$('.ig',r).value,$('.ir',r).value]).filter(x=>x[1]>0);
    if(!name||!ing.length){toast('Fyll i namn och minst en ingrediens med gram');return}
    if(!ing.some(x=>x[2]==='P')){toast('Markera minst en ingrediens som proteinkälla')}
    const link=$('#rl').value.trim();
    state.custom.push({id:'c'+Date.now(),name,meals:[$('#rm').value],min:+$('#rt').value||30,lf:$('#rlf').checked?1:0,link:/^https?:\/\//.test(link)?link:'',custom:true,ing});
    save();rebuildRecipes();render();toast('Receptet är sparat');
  }
  else if(act==='delrecipe'){
    const rid=t.dataset.rid;state.custom=state.custom.filter(r=>r.id!==rid);
    Object.keys(state.plan||{}).forEach(k=>{state.plan[k]=state.plan[k].filter(en=>en.rid!==rid)});
    rebuildRecipes();changed(0,true);
  }
  else if(act==='addoffer'){
    const price=+$('#opr').value;if(!(price>0)){toast('Ange ett pris');return}
    const o={id:'u'+Date.now(),store:$('#os').value,pid:$('#op').value,kind:$('#ok').value,price,buy:+$('#ob').value||3,pay:+$('#oy').value||2,max:+$('#om').value||0,reg:+$('#oreg').value||0,regSrc:'',packG:+$('#opg').value||0,qty:'',heading:(PRODUCTS[$('#op').value]||{}).name+' (inlagd av dig)',until:''};
    if(o.kind==='multi'&&o.pay>=o.buy){toast('Betala-antalet måste vara lägre än köp-antalet');return}
    if(!state.offers)state.offers=clone(allOffers());
    state.offers.push(o);save();rebuildRecipes();changed(0,false);toast('Kampanjen är inlagd');
  }
  else if(act==='deloffer'){
    if(!state.offers)state.offers=clone(allOffers());
    state.offers=state.offers.filter(o=>o.id!==t.dataset.id);save();rebuildRecipes();changed(0,false);
  }
  else if(act==='resetoffers'){state.offers=null;save();rebuildRecipes();changed(0,false)}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='fq'){e.preventDefault();doFind(false)}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.act==='w'){const o=$('#o-'+t.dataset.k);if(o)o.textContent=t.value}
  if(t.dataset.act==='ofilter'){OFILTER.q=t.value;clearTimeout(window.__oft);window.__oft=setTimeout(()=>{if(tab==='offers'){render();const el=$('#of');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}},350)}
  if(t.dataset.act==='pfilter'){
    const q=t.value.trim().toLowerCase();
    $$('.pitem').forEach(el=>{el.hidden=q&&el.dataset.name.indexOf(q)<0});
  }
});
document.addEventListener('change',e=>{
  const t=e.target,act=t.dataset&&t.dataset.act;if(!act)return;
  if(act==='w'){state.w[t.dataset.k]=+t.value;state.seed++;regenerate(.05,false);render()}
  else if(act==='setrecipe'){state.plan[t.dataset.m][+t.dataset.i]={rid:t.value,locked:true};save();render()}
  else if(act==='tick'){state.ticked[t.dataset.pid]=t.checked;save();render()}
  else if(act==='pick'){state.picked[t.dataset.id]=t.checked;if(!t.checked)delete state.picked[t.dataset.id];save();rebuildRecipes();regenerate(0,true);render()}
  else if(act==='ostore'){OFILTER.store=t.value;render()}
  else if(act==='oonly'){OFILTER.only=t.checked;render()}
  else if(act==='pantry'){state.pantry[t.dataset.pid]=t.checked;save();t.closest('.pitem').classList.toggle('on',t.checked);
    const n=Object.keys(state.pantry).filter(k=>state.pantry[k]).length;const p=$('#view .card p.muted');if(p)p.textContent='Bocka för det du har hemma så tas det bort från inköpslistan. '+n+' varor markerade.'}
  else if(act==='person'){
    const pp=state.persons[+t.dataset.i],f=t.dataset.f;
    if(f==='name')pp.name=t.value.trim()||('Person '+(+t.dataset.i+1));
    else if(f==='sex'||f==='goal')pp[f]=t.value;
    else{const lim={age:[14,99],height:[120,230],weight:[35,250]}[f];pp[f]=lim?clamp(+t.value||pp[f],lim[0],lim[1]):+t.value}
    save();render();
  }
  else if(act==='protein'){state.protein=+t.value;save();changed(0,true)}
  else if(act==='rkey'){state.rkey=t.value.trim();save();toast(state.rkey?'Nyckeln är sparad':'Nyckeln är borttagen')}
  else if(act==='gen'){state.gen=t.checked;save();rebuildRecipes();changed(0,true)}
  else if(act==='lf'){state.lf=t.checked;save();render()}
  else if(act==='stock'){state.stock=t.checked;save();render()}
  else if(act==='mealon'){state.meals[t.dataset.m].on=t.checked;save();changed(0,true)}
  else if(act==='mealdays'){const c=state.meals[t.dataset.m];c.days=clamp(Math.round(+t.value)||1,1,7);c.uniq=Math.min(c.uniq,c.days);save();changed(0,true)}
  else if(act==='mealuniq'){const c=state.meals[t.dataset.m];c.uniq=clamp(Math.round(+t.value)||1,1,Math.min(7,c.days));save();changed(0,true)}
  else if(act==='storeallow'){state.stores[t.dataset.s]=t.checked;if(!STORES.some(s=>state.stores[s.id])){state.stores[t.dataset.s]=true;toast('Minst en butik måste vara vald')}state.chosen=null;save();rebuildRecipes();changed(0,true)}
});

/* ================= start ================= */
function fail(e,where){
  const msg=(e&&(e.message||e))+'';
  document.getElementById('view').innerHTML=
    '<section class="card"><h2>Appen kunde inte starta</h2>'+
    '<p>Något gick fel när '+esc(where)+'. Felet är: <strong>'+esc(msg)+'</strong></p>'+
    '<p class="muted small">Version '+BUILD+'. Oftast hjälper det att nollställa sparad data. Dina betyg, historik och skafferi försvinner då.</p>'+
    '<div class="row"><button class="btn primary" onclick="try{localStorage.removeItem(\'veckohandla.v1\')}catch(e){};location.reload()">Nollställ och ladda om</button></div></section>';
  try{console.error(where,e)}catch(x){}
}
try{
  rebuildRecipes();
  if(!state.plan||!Object.keys(state.plan).length)regenerate(0,false);
  else{regenerate(0,true)}
}catch(e){
  try{state=clone(DEFAULTS);state.plan=null;rebuildRecipes();regenerate(0,false);save()}
  catch(e2){fail(e2,'veckoplanen skulle byggas');}
}
try{render()}catch(e){fail(e,'sidan skulle ritas upp')}
try{loadLive()}catch(e){}
})();
</script>
